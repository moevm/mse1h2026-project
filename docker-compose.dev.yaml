name: mse1h2026-project-dev

services:
  db:
    image: mysql:8.4.8
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes: [ db_dev_data:/var/lib/mysql ]
    ports: [ "127.0.0.1:3306:3306" ]
    restart: unless-stopped
    env_file: .env

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.ex\
            it(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/prisma:/app/backend/prisma
    ports: [ "127.0.0.1:3000:3000" ]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    env_file: .env

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    environment:
      DEV_DOCKER: "true"
      VITE_API_BASE_URL: http://127.0.0.1:3000/api
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
    ports: [ "127.0.0.1:8080:8080" ]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    env_file: .env

volumes:
  db_dev_data:
    driver: local

networks:
  default:
    driver: bridge
