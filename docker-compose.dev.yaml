name: mse1h2026-project-dev

services:
  db:
    image: mysql:lts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes: [db_dev_data:/var/lib/mysql]
    ports: ["${MYSQL_OUTPUT_URL}:3306"]
    restart: unless-stopped
    env_file: .env

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      start_period: 45s
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/prisma:/app/backend/prisma
    ports: ["${BACKEND_OUTPUT_URL}:3000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    env_file: .env

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    environment:
      DOCKER: "true"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
    ports: ["${FRONTEND_OUTPUT_URL}:5173"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    env_file: .env

volumes:
  db_dev_data:
    driver: local

networks:
  default:
    driver: bridge
