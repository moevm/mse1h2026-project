services:
  db:
    image: mysql:lts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes: [db_data:/var/lib/mysql]
    restart: unless-stopped
    env_file: .env

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    env_file: .env

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    env_file: .env
    ports: ["${FRONTEND_HOST}:${FRONTEND_PORT}:80"]

volumes:
  db_data:
    driver: local

networks:
  default:
    driver: bridge
