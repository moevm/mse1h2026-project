services:
  db:
    image: mysql:lts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes: [db_data:/var/lib/mysql]
    restart: unless-stopped
    env_file: .env

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-fS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    env_file: .env
    ports: ["${BACKEND_OUTPUT_URL}:3000"]

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    env_file: .env
    ports: ["${FRONTEND_OUTPUT_URL}:80"]

volumes:
  db_data:
    driver: local

networks:
  default:
    driver: bridge
