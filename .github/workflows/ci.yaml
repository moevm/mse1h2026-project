name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        task: [format:check, lint, typecheck]

    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 'Fetch Latest Main Branch'
        run: git fetch origin main --depth=1

      - name: 'Setup Project'
        uses: ./.github/actions/setup

      - name: 'Run Checks'
        run: pnpm --filter "...[origin/main]" --filter "!mse1h2026-project" -r ${{ matrix.task }}

  build:
    needs: [check]
    runs-on: ubuntu-24.04

    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 'Fetch Latest Main Branch'
        run: git fetch origin main --depth=1

      - name: 'Setup Project'
        uses: ./.github/actions/setup

      - name: 'Build Project'
        run: pnpm run build

  docker:
    needs: [build]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable BuildKit
        run: |
          echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV
          echo "COMPOSE_DOCKER_CLI_BUILD=1" >> $GITHUB_ENV

      - name: Build Docker images
        run: docker compose build
